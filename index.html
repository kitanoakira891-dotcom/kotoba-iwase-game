<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#6656e8">
  <meta name="description" content="友人とリアルタイムで共有できる、言葉の回数と得点のカウンター">
  <title>ことばポイント</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<main class="shell">
  <header class="top">
    <div><p class="eyebrow">SHARED WORD GAME</p><h1>ことばポイント</h1></div>
    <span id="status" class="status warn" aria-live="polite">接続中</span>
  </header>

  <section id="setup" class="panel setup" aria-labelledby="setupTitle">
    <h2 id="setupTitle">ゲームを始める</h2>
    <label>表示名<input id="playerName" maxlength="16" autocomplete="nickname" placeholder="例：あきら"></label>
    <button id="createBtn" class="primary wide" disabled>新しい部屋を作る</button>
    <div class="or"><span>または</span></div>
    <label>6桁の部屋コード<input id="roomInput" maxlength="6" autocomplete="off" autocapitalize="characters" spellcheck="false" inputmode="text" placeholder="ABC123"></label>
    <button id="joinBtn" class="secondary wide" disabled>部屋に参加</button>
    <p class="note">参加者のアカウント登録は不要です。主催者が送ったURLまたは部屋コードで参加できます。</p>
  </section>

  <section id="game" class="hidden" aria-labelledby="tableTitle">
    <section class="panel roombar">
      <div><small>ROOM</small><strong id="roomCode">------</strong></div>
      <button id="copyBtn" class="mini">共有URLをコピー</button>
      <button id="leaveBtn" class="mini neutral">退出</button>
    </section>
    <section class="summary" aria-label="集計">
      <div class="summaryCard purple"><span>合計得点</span><strong id="scoreTotal">0</strong></div>
      <div class="summaryCard dark"><span>総カウント</span><strong id="countTotal">0</strong></div>
    </section>
    <section class="heading"><div><h2 id="tableTitle">得点表</h2><p id="role" class="muted"></p></div><button id="addBtn" class="primary compact">＋ 言葉を追加</button></section>
    <div id="wordList" class="wordList"></div>
    <div id="empty" class="panel empty hidden">言葉が登録されていません。</div>
    <button id="resetBtn" class="reset hidden">すべての得点をリセット</button>
  </section>
</main>

<dialog id="editor" aria-labelledby="editorTitle"><form id="editorForm">
  <h2 id="editorTitle">言葉を追加</h2><input type="hidden" id="editId">
  <label>言葉<input id="wordText" maxlength="40" required></label>
  <label>1回あたりの得点<input id="wordPoints" type="number" min="-999" max="999" step="1" value="1" required></label>
  <div class="dialogButtons"><button type="button" id="cancelBtn" class="neutral">キャンセル</button><button class="primary">保存</button></div>
</form></dialog>
<div id="toast" class="toast hidden" role="status" aria-live="polite"></div>
<script type="module" src="app.js"></script>
</body>
</html>
