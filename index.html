<!doctype html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>いや～でも～って言わせるゲーム</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="leaderboard.css"></head><body><main class="shell"><header class="top"><div><p class="eyebrow">SHARED WORD GAME</p><h1>いや～でも～って言わせるゲーム</h1></div><span id="status" class="status warn">接続中</span></header>
<section id="setup" class="panel setup"><h2>参加方法</h2><label>表示名<input id="playerName" maxlength="16"></label><button id="joinBtn" class="primary wide" disabled>一般参加</button><div class="or"><span>管理者</span></div><label>管理者パスワード<input id="adminPassword" type="password"></label><button id="adminJoinBtn" class="secondary wide" disabled>管理者権限で参加</button></section>
<section id="lobby" class="hidden"><section class="panel lobbyPanel"><div class="sectionHead"><h2>部屋一覧</h2><button id="newRoomBtn" class="primary compact">＋ 部屋作成</button></div><div id="roomList" class="roomList"></div></section><section class="panel templatePanel"><div class="sectionHead"><div><h2>得点表</h2><p class="muted">最大5個</p></div><button id="saveTemplateBtn" class="secondary compact">現在の得点表を保存</button></div><div id="templateList" class="templateList"></div></section></section>
<section id="game" class="hidden"><section class="panel roombar"><div><small>ROOM</small><strong id="roomName"></strong><span id="templateBadge" class="templateBadge"></span></div><button id="backBtn" class="mini neutral">部屋一覧</button></section><section class="summary"><div class="summaryCard purple"><span>全員の合計得点</span><strong id="scoreTotal">0</strong></div><div class="summaryCard dark"><span>全員の総カウント</span><strong id="countTotal">0</strong></div></section><section class="panel leaderboard"><div class="leaderboardHead"><h2>参加者スコア</h2><span id="memberCount" class="muted"></span></div><div id="memberList"></div><button id="resetBtn" class="resetAll hidden">全スコアと統計をリセット</button></section><section class="panel stats"><h2>統計</h2><h3 class="chartTitle">言葉別の累計回数</h3><canvas id="statsChart" height="230"></canvas><h3 class="chartTitle">発言タイムライン</h3><p class="chartNote">横軸は時刻、縦軸は累計回数、凡例は言葉です。</p><canvas id="timelineChart" height="280"></canvas><div id="timelineLegend" class="timelineLegend"></div></section><section class="heading"><div><h2>得点表</h2><p id="role" class="muted"></p></div><div class="headActions"><button id="repairBtn" class="secondary compact hidden">新井を復元</button><button id="addBtn" class="primary compact">＋ 言葉追加</button></div></section><div id="wordList" class="wordList"></div><div id="wordEmpty" class="panel empty hidden">この部屋の得点表は空です。</div></section></main>
<dialog id="roomDlg"><form id="roomForm"><h2>部屋作成</h2><label>部屋名<input id="newRoomName" maxlength="24" required></label><label>得点表<select id="templateSelect" required></select></label><div class="dialogButtons"><button type="button" class="neutral cancel">キャンセル</button><button class="primary">作成</button></div></form></dialog><dialog id="templateDlg"><form id="templateForm"><h2>得点表を保存</h2><label>名前<input id="newTemplateName" maxlength="24" required></label><div class="dialogButtons"><button type="button" class="neutral cancel">キャンセル</button><button class="primary">保存</button></div></form></dialog><dialog id="wordDlg"><form id="wordForm"><h2>言葉を編集</h2><input id="wordId" type="hidden"><label>言葉<input id="wordText" maxlength="40" required></label><label>得点<input id="wordPoints" type="number" min="-999" max="999" required></label><div class="dialogButtons"><button type="button" class="neutral cancel">キャンセル</button><button class="primary">保存</button></div></form></dialog><div id="toast" class="toast hidden"></div><script type="module" src="app.js?v=20260904-7"></script></body></html>
