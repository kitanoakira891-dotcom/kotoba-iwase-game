<!doctype html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#6656e8"><title>いや～でも～って言わせるゲーム</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="leaderboard.css"></head><body>
<main class="shell"><header class="top"><div><p class="eyebrow">SHARED WORD GAME</p><h1>いや～でも～って言わせるゲーム</h1></div><span id="status" class="status warn">接続中</span></header>
<section id="setup" class="panel setup"><h2>参加</h2><label>表示名<input id="playerName" maxlength="16" autocomplete="nickname"></label><button id="joinBtn" class="primary wide" disabled>一般参加</button><div class="or"><span>管理者</span></div><label>管理者パスワード<input id="adminPassword" type="password"></label><button id="adminJoinBtn" class="secondary wide" disabled>管理者権限で参加</button><p class="note">同じ端末では名前を変えてもスコアを引き継ぎます。</p></section>
<section id="lobby" class="hidden"><section class="panel lobbyPanel"><div class="sectionHead"><div><h2>部屋一覧</h2><p class="muted">作成済みの部屋</p></div><div class="headActions"><button id="loginBackBtn" class="neutral compact">ログイン画面へ</button><button id="newRoomBtn" class="primary compact">＋ 部屋作成</button></div></div><div id="roomList" class="roomList"></div><div id="roomEmpty" class="empty hidden">部屋がありません。</div></section></section>
<section id="game" class="hidden"><section class="panel roombar"><div><small>ROOM</small><strong id="roomName"></strong></div><button id="lobbyBackBtn" class="mini neutral">部屋一覧</button></section><section class="panel roomTools"><div><strong>得点表</strong><span id="templateCount" class="muted"></span></div><div class="roomToolButtons"><button id="loadTemplateBtn" class="secondary compact">LOAD</button><button id="saveTemplateBtn" class="secondary compact">SAVE</button><button id="deleteTemplateBtn" class="neutral compact">DELETE</button></div></section>
<section class="summary"><div class="summaryCard purple"><span>全員の合計得点</span><strong id="scoreTotal">0</strong></div><div class="summaryCard dark"><span>全員の総カウント</span><strong id="countTotal">0</strong></div></section><section class="panel leaderboard"><div class="leaderboardHead"><h2>参加者スコア</h2><span id="memberCount" class="muted">0人</span></div><div id="memberList" class="memberList"></div><button id="resetAllBtn" class="resetAll hidden">全員のスコアと統計をリセット</button></section><section class="panel stats"><div class="leaderboardHead"><h2>統計</h2><span class="muted">リアルタイム更新</span></div><h3 class="chartTitle">言葉別の累計回数</h3><canvas id="statsChart" height="230"></canvas><h3 class="chartTitle">発言タイムライン</h3><p class="chartNote">横軸は時刻、縦軸は累計回数、凡例は言葉です。</p><canvas id="timelineChart" height="280"></canvas><div id="timelineLegend" class="timelineLegend"></div></section><section class="heading"><div><h2>得点表</h2><p id="role" class="muted"></p></div><button id="addBtn" class="primary compact">＋ 言葉を追加</button></section><div id="wordList" class="wordList"></div><div id="empty" class="panel empty hidden">言葉が登録されていません。</div></section></main>
<dialog id="roomDialog"><form id="roomForm"><h2>部屋作成</h2><label>部屋名<input id="newRoomName" maxlength="24" required></label><label>初期得点表<select id="createTemplateSelect"></select></label><div class="dialogButtons"><button type="button" class="neutral cancel">キャンセル</button><button class="primary">作成</button></div></form></dialog>
<dialog id="templateDialog"><form id="templateForm"><h2>得点表を保存</h2><label>名前<input id="templateName" maxlength="24" required></label><p class="note">同名がある場合は上書きします。</p><div class="dialogButtons"><button type="button" class="neutral cancel">キャンセル</button><button class="primary">保存</button></div></form></dialog>
<dialog id="selectTemplateDialog"><form id="selectTemplateForm"><h2 id="selectTemplateTitle">得点表を選択</h2><label>得点表<select id="templateSelect" required></select></label><p id="selectTemplateNote" class="note"></p><div class="dialogButtons"><button type="button" class="neutral cancel">キャンセル</button><button class="primary" id="selectTemplateSubmit">実行</button></div></form></dialog>
<dialog id="editor"><form id="editorForm"><h2 id="editorTitle">言葉を追加</h2><input type="hidden" id="editId"><label>言葉<input id="wordText" maxlength="40" required></label><label>1回あたりの得点<input id="wordPoints" type="number" min="-999" max="999" step="1" value="1" required></label><div class="dialogButtons"><button type="button" class="neutral cancel">キャンセル</button><button class="primary">保存</button></div></form></dialog><div id="toast" class="toast hidden"></div><script type="module" src="app.js?v=20260904-stable1"></script></body></html>
